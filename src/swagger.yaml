openapi: 3.0.0
info:
  title: TalkMart API Sənədləri
  description: Flutter tərtibatçıları üçün Backend API endpointləri. Autentifikasiya və Video xidmətlərini ehtiva edir.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api
    description: Lokal inkişaf serveri
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []

paths:
  # ==============================
  #          AUTH ROUTES (GİRİŞ/QEYDİYYAT)
  # ==============================
  /auth/register/user:
    post:
      summary: Yeni istifadəçi qeydiyyatı
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, phone, email, password]
              properties:
                fullName:
                  type: string
                  example: "Əli Əliyev"
                phone:
                  type: string
                  example: "+994551234567"
                email:
                  type: string
                  format: email
                  example: "ali@example.com"
                password:
                  type: string
                  format: password
                  example: "sirr123"
      responses:
        '201':
          description: Qeydiyyat tamamlandı, e-poçta OTP göndərildi.
        '400':
          description: Validasiya xətası
        '409':
          description: E-poçt və ya telefon artıq qeydiyyatdan keçib

  /auth/register/provider:
    post:
      summary: Yeni xidmət təminatçısı (provider) qeydiyyatı
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, companyName, email, phone, categoryId, address, password, confirmPassword]
              properties:
                firstName:
                  type: string
                  example: "Cəmilə"
                lastName:
                  type: string
                  example: "Məmmədova"
                companyName:
                  type: string
                  example: "Cəmilə Təmizlik"
                email:
                  type: string
                  format: email
                  example: "cemile@example.com"
                phone:
                  type: string
                  example: "+994501234567"
                categoryId:
                  type: string
                  example: "64efc9abc1234567890abc01"
                  description: "Seçilmiş xidmət kateqoriyasının ObjectId-si"
                address:
                  type: string
                  example: "Neftçilər pr, 12, Bakı"
                password:
                  type: string
                  format: password
                  example: "sirr123"
                confirmPassword:
                  type: string
                  format: password
                  example: "sirr123"
      responses:
        '201':
          description: Qeydiyyat tamamlandı, e-poçta OTP göndərildi.
        '400':
          description: Validasiya xətası (məs. şifrələr uyğun gəlmir)
        '409':
          description: E-poçt və ya telefon artıq qeydiyyatdan keçib


  /auth/register/verify-otp:
    post:
      summary: Qeydiyyat üçün göndərilmiş OTP-ni təsdiqlə
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                  example: "ali@example.com"
                code:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: E-poçt uğurla təsdiqləndi və İstifadəçi məlumatları & JWT token qaytarılır.
        '400':
          description: Yanlış OTP və ya vaxtı keçib
        '429':
          description: Çox sayda uyğun olmayan cəhd

  /auth/login:
    post:
      summary: İstifadəçi və ya providerin E-poçt & Şifrə ilə daxil olması
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "ali@example.com"
                password:
                  type: string
                  format: password
                  example: "sirr123"
      responses:
        '200':
          description: Uğurlu giriş, JWT token və İstifadəçi məlumatlarını qaytarır.
        '401':
          description: Yanlış məlumatlar (şifrə və ya e-poçt səhvdir)

  /auth/forgot-password:
    post:
      summary: Şifrənin sıfırlanması üçün OTP tələb et
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
               type: object
               required: [email]
               properties:
                 email:
                   type: string
                   format: email
                   example: "ali@example.com"
      responses:
        '200':
          description: OTP göndərildi (Təhlükəsizlik məqsədilə, format düzgündürsə həmişə uğur qaytarır).

  /auth/forgot-password/verify-otp:
    post:
      summary: Şifrə sıfırlamaq üçün göndərilən OTP-ni təsdiqlə
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                  example: "ali@example.com"
                code:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Kod uğurla təsdiqləndi, müvəqqəti sıfırlama tokeni (reset token) qaytarır.
        '400':
          description: Yanlış OTP və ya vaxtı keçib

  /auth/forgot-password/reset-password:
    post:
      summary: Müvəqqəti token vasitəsilə şifrəni yenilə
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resetToken, newPassword]
              properties:
                resetToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                newPassword:
                  type: string
                  format: password
                  example: "yeniSirr123"
      responses:
        '200':
          description: Şifrə uğurla dəyişdirildi.
        '400':
          description: Yanlış və ya vaxtı keçmiş sıfırlama tokeni.

  # ==============================
  #          USER ROUTES (İSTİFADƏÇİ VƏ PROVAYDER)
  # ==============================
  /users/user:
    put:
      summary: Yalnız adi istifadəçi (User) məlumatlarını yenilə
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  example: "Yeni Ad Soyad"
                email:
                  type: string
                  format: email
                  example: "yeniemail@example.com"
                password:
                  type: string
                  format: password
                  example: "yenisirr123"
                confirmPassword:
                  type: string
                  format: password
                  example: "yenisirr123"
      responses:
        '200':
          description: İstifadəçi profili uğurla yeniləndi.
        '400':
          description: Şifrələr eyni deyil və ya validasiya xətası var
        '401':
          description: İcazəsiz (Token əskik və ya keçərsizdir)
        '403':
          description: Provider və ya Admin bu api-dən istifadə edə bilməz
        '404':
          description: İstifadəçi tapılmadı
        '409':
          description: E-poçt ünvanı artıq istifadədədir

  /users/provider:
    put:
      summary: Yalnız xidmət təminatçısı (Provider) məlumatlarını yenilə
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  example: "Yeni Şirkət Sahibi"
                email:
                  type: string
                  format: email
                  example: "sirket@example.com"
                password:
                  type: string
                  format: password
                  example: "yenisirr123"
                confirmPassword:
                  type: string
                  format: password
                  example: "yenisirr123"
                bio:
                  type: string
                  example: "Xidmətlərimizi daha sərfəli və keyfiyyətli etdik. (Bioqrafiya)"
                location:
                  type: string
                  example: "Gəncə, Azərbaycan"
      responses:
        '200':
          description: Provider profili uğurla yeniləndi.
        '400':
          description: Şifrələr eyni deyil və ya validasiya xətası var
        '401':
          description: İcazəsiz (Token əskik və ya keçərsizdir)
        '403':
          description: İstifadəçi provayder deyil (icazə yoxdur)
        '404':
          description: İstifadəçi tapılmadı
        '409':
          description: E-poçt ünvanı artıq istifadədədir

  # ==============================
  #    PROFİL ŞƏKLİ
  # ==============================
  /users/profile-image:
    put:
      summary: "Profil şəklini yüklə / dəyişdir"
      description: "LOGIN TƏLƏB OLUNUR — User + Provider. Əvvəlki şəkil Cloudinary-dən silinir."
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: "Profil şəkli (jpg, png, webp, gif). Max 10MB."
      responses:
        '200':
          description: Profil şəkli yükləndi
        '400':
          description: Şəkil faylı əskikdir
        '401':
          description: Login tələb olunur
    delete:
      summary: "Profil şəklini sil"
      description: "LOGIN TƏLƏB OLUNUR — Cloudinary-dən silinir, DB təmizlənir."
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil şəkli silindi
        '400':
          description: Profil şəkli mövcud deyil
        '401':
          description: Login tələb olunur

  # ==============================
  #    VIDEO FEED / EXPLORE (BİRLƏŞDİRİLMİŞ API)
  # ==============================
  /videos/feed:
    get:
      summary: "Ana Səhifə (Reels) üçün təsadüfi videolar"
      description: >
        GUEST DOSTu — Token olmadan da işləyir.
        BİRLƏŞDİRİLMİŞ API — provider phone, likeCount, saveCount, isLiked, isSaved hamısı bir response-da.
      tags: [Video]
      security: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Qaytarılacaq video sayı
      responses:
        '200':
          description: Videolar + provider + engagement bir response-da
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 10
                  videos:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                        price:
                          type: number
                        videoUrl:
                          type: string
                        thumbnail:
                          type: string
                        categoryId:
                          type: string
                        duration:
                          type: number
                        likeCount:
                          type: integer
                        viewCount:
                          type: integer
                        saveCount:
                          type: integer
                        createdAt:
                          type: string
                          format: date-time
                        providerId:
                          type: string
                        provider:
                          type: object
                          properties:
                            fullName:
                              type: string
                            companyName:
                              type: string
                              nullable: true
                            phone:
                              type: string
                              description: Providerin əlaqə nömrəsi
                        isLiked:
                          type: boolean
                          description: "Guest üçün həmişə false"
                        isSaved:
                          type: boolean
                          description: "Guest üçün həmişə false"

  /videos/explore:
    get:
      summary: "Kəşf Et (Explore) — kateqoriyalı və axtarışlı list"
      description: >
        GUEST DOSTu — Token olmadan da işləyir.
        BİRLƏŞDİRİLMİŞ API — provider phone, isLiked, isSaved hamısı bir response-da.
      tags: [Video]
      security: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 15
        - in: query
          name: categoryId
          schema:
            type: string
          description: Kateqoriya filteri (ObjectId)
        - in: query
          name: search
          schema:
            type: string
          description: Video adı üzrə axtarış
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, trending, price_low, price_high]
          description: "Sıralama (default: newest)"
        - in: query
          name: location
          schema:
            type: string
          description: "Provider ünvanına görə filter (məs: Bakı, Sumqayıt)"
        - in: query
          name: minPrice
          schema:
            type: number
          description: "Minimum qiymət (məs: 10)"
        - in: query
          name: maxPrice
          schema:
            type: number
          description: "Maksimum qiymət (məs: 500)"

      responses:
        '200':
          description: Səhifələnmiş videolar + provider + engagement
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  total:
                    type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer
                  videos:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                        price:
                          type: number
                        videoUrl:
                          type: string
                        thumbnail:
                          type: string
                        categoryId:
                          type: string
                        duration:
                          type: number
                        likeCount:
                          type: integer
                        viewCount:
                          type: integer
                        saveCount:
                          type: integer
                        createdAt:
                          type: string
                          format: date-time
                        providerId:
                          type: string
                        provider:
                          type: object
                          properties:
                            fullName:
                              type: string
                            companyName:
                              type: string
                              nullable: true
                            phone:
                              type: string
                        isLiked:
                          type: boolean
                        isSaved:
                          type: boolean

  # ==============================
  # ==============================
  #    LIKED / SAVED VIDEOLAR
  # ==============================
  /videos/liked:
    get:
      summary: "İstifadəçinin bəyəndiyi videoları gətir"
      description: "LOGIN TƏLƏB OLUNUR — Səhifələnmiş, provider phone və isSaved daxil."
      tags: [Engagement]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Bəyənilmiş videoların siyahısı
        '401':
          description: Login tələb olunur

  /videos/saved:
    get:
      summary: "İstifadəçinin yadda saxladığı videoları gətir"
      description: "LOGIN TƏLƏB OLUNUR — Səhifələnmiş, provider phone və isLiked daxil."
      tags: [Engagement]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Yadda saxlanmış videoların siyahısı
        '401':
          description: Login tələb olunur

  # ==============================
  #          VIDEO ROUTES (VİDEO)
  # ==============================
  /videos/upload:
    post:
      summary: Yeni xidmət videosu yüklə (Yalnız Providerlər üçün)
      tags: [Video]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, description, price, video]
              properties:
                title:
                  type: string
                  description: "Video xidmətinin başlığı"
                  example: "Peşəkar Santexnika Xidməti"
                description:
                  type: string
                  description: "Xidmət haqqında ətraflı məlumat"
                  example: "Boru və su xətlərini tez bir zamanda təmir edirik."
                price:
                  type: number
                  format: float
                  description: "Xidmət videosu üzrə təyin edilmiş qiymət"
                  example: 50.5
                video:
                  type: string
                  format: binary
                  description: "Əsas video faylı (.mp4, .mov, vs.) Maksimum 500MB."
      responses:
        '201':
          description: Video uğurla Cloudinary-yə yükləndi və bazada yadda saxlanıldı.
        '400':
          description: Validasiya xətası, əskik məlumatlar və ya keçərsiz fayl.
        '401':
          description: İcazəsiz (Token əskikdir və ya keçərsizdir)
        '403':
          description: Qadağan edilib (İstifadəçi Provider deyil)

  /videos/my-videos:
    get:
      summary: Providerin öz yüklədiyi bütün videoları gətir
      tags: [Video]
      responses:
        '200':
          description: Providerin videolarından ibarət massiv (array) qaytarır.
        '401':
          description: İcazəsiz
        '403':
          description: Qadağan edilib (Provider deyil)

  /videos/{id}:
    delete:
      summary: İD-yə əsasən videonu sil
      tags: [Video]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Videonun MongoDB ObjectId-si
          example: "64efc9abc1234567890def12"
      responses:
        '200':
          description: Video uğurla həm MDB (baza), həm də Cloudinary-dən silindi.
        '401':
          description: İcazəsiz
        '403':
          description: Qadağan edilib (Provider deyil)
        '404':
          description: Video tapılmadı və ya sizə aid deyil.

  # ==============================
  #      ENGAGEMENT ROUTES (ƏLAQƏ/ETKİLƏŞİM)
  # ==============================
  /videos/{id}/like:
    post:
      summary: Videonu bəyən / bəyənməkdən voz keç (Toggle Like)
      description: >
        Videonu bəyənmək və ya bəyənməkdən çıxarmaq üçün istifadə olunur. Hər istifadəçi videonu yalnız 1 dəfə bəyənə bilər.
        Təkrar çağırıldıqda bəyənmə geri alınır (toggle). Həm istifadəçilər, həm də providerlər üçün keçərlidir.
        Anti-fake: İstifadəçilər öz videolarını bəyənə bilməz. Rate limit: dəqiqədə 30 istək.
      tags: [Engagement]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Videonun MongoDB ObjectId-si
          example: "64efc9abc1234567890def12"
      responses:
        '200':
          description: Bəyənmə statusunu və yenilənmiş likeCount (bəyənmə sayını) qaytarır.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  liked:
                    type: boolean
                    description: Videonun hazırda bəyənilib-bəyənilməməsi.
                    example: true
                  likeCount:
                    type: integer
                    example: 42
                  message:
                    type: string
                    example: "Like edildi."
        '400':
          description: Keçərsiz video ID formatı
        '401':
          description: İcazəsiz
        '403':
          description: Öz videonuzu bəyənə bilməzsiniz
        '404':
          description: Video tapılmadı
        '429':
          description: Çox sayda istək (rate limit aşıldı)

  /videos/{id}/save:
    post:
      summary: Videonu yadda saxla / yaddaşdan sil (Toggle Save/Bookmark)
      description: >
        Videonu yadda saxlamaq və ya silmək. Hər istifadəçi yalnız 1 dəfə yadda saxlaya bilər.
        Təkrar çağırıldıqda yaddaşdan silinir (toggle). Həm istifadəçilər, həm də providerlər üçün.
        Anti-fake: İstifadəçilər öz videolarını yadda saxlaya bilməz. Rate limit: dəqiqədə 30 istək.
      tags: [Engagement]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Videonun MongoDB ObjectId-si
          example: "64efc9abc1234567890def12"
      responses:
        '200':
          description: Yadda saxlama statusunu və yenilənmiş saveCount (yaddaşlanma sayını) qaytarır.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  saved:
                    type: boolean
                    description: Videonun hazırda yadda saxlanılıb-saxlanılmaması.
                    example: true
                  saveCount:
                    type: integer
                    example: 15
                  message:
                    type: string
                    example: "Video kayd edildi."
        '400':
          description: Keçərsiz video ID formatı
        '401':
          description: İcazəsiz
        '403':
          description: Öz videonuzu yadda saxlaya bilməzsiniz
        '404':
          description: Video tapılmadı
        '429':
          description: Çox sayda istək (rate limit aşıldı)

  /videos/{id}/view:
    post:
      summary: Video üçün baxış qeyd etməklə (24 saatlıq limitli)
      description: >
        Baxış (view) sayını qeyd edir. Anti-fake önləmləri:
        1) Eyni istifadəçi hər 24 saatda yalnız 1 baxış qeyd edə bilər.
        2) Provider öz videosunun baxış sayını artıra bilməz (özünə baxışlar nəzərə alınmır).
        3) Rate limit: dəqiqədə 30 istək.
        4) Atomik sayğaclar (Race condition qorunması).
        Kimsə videoya baxmağa başlayanda bu endpoint-i çağırın.
      tags: [Engagement]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Videonun MongoDB ObjectId-si
          example: "64efc9abc1234567890def12"
      responses:
        '200':
          description: Baxışın nəzərə alınıb-alınmadığını və cari baxış (viewCount) sayını qaytarır.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  counted:
                    type: boolean
                    description: Baxışın məqbul sayılıb-sayılmadığını (24 saatlıq dövrə görə) göstərir.
                    example: true
                  viewCount:
                    type: integer
                    example: 128
                  message:
                    type: string
                    example: "Görüntülənmə qeyd edildi."
        '400':
          description: Keçərsiz video ID formatı
        '401':
          description: İcazəsiz
        '404':
          description: Video tapılmadı
        '429':
          description: Çox sayda istək (rate limit aşıldı)

  /videos/{id}/engagement:
    get:
      summary: Video üçün statistika (baxış sayı + user statusu) gətir
      description: >
        Videonun bəyənmə/baxış/yaddaşlanma saylarını və mövcud istifadəçinin onu bəyənib/yadda saxlayıb-saxlamadığını qaytarır.
        UI dizaynı hazırlamaq üçün faydalıdır (içi dolu ürək, yaddaş ikonu vs).
      tags: [Engagement]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Videonun MongoDB ObjectId-si
          example: "64efc9abc1234567890def12"
      responses:
        '200':
          description: Bütün etkileşim/statistika məlumatlarını qaytarır.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  likeCount:
                    type: integer
                    example: 42
                  viewCount:
                    type: integer
                    example: 128
                  saveCount:
                    type: integer
                    example: 15
                  isLiked:
                    type: boolean
                    description: Cari istifadəçi bu videonu bəyənibmi.
                    example: true
                  isSaved:
                    type: boolean
                    description: Cari istifadəçi bu videonu yadda saxlayıbmı.
                    example: false
        '400':
          description: Keçərsiz video ID formatı
        '401':
          description: İcazəsiz
        '404':
          description: Video tapılmadı
