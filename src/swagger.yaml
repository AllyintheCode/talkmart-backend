openapi: 3.0.0
info:
  title: TalkMart API Sənədləri
  description: Flutter tərtibatçıları üçün Backend API endpointləri. Autentifikasiya və Video xidmətlərini ehtiva edir.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api
    description: Lokal inkişaf serveri
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []

paths:
  # ==============================
  #          AUTH ROUTES (GİRİŞ/QEYDİYYAT)
  # ==============================
  /auth/register/user:
    post:
      summary: Yeni istifadəçi qeydiyyatı
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, phone, email, password]
              properties:
                fullName:
                  type: string
                  example: "Əli Əliyev"
                phone:
                  type: string
                  example: "+994551234567"
                email:
                  type: string
                  format: email
                  example: "ali@example.com"
                password:
                  type: string
                  format: password
                  example: "sirr123"
      responses:
        '201':
          description: Qeydiyyat tamamlandı, e-poçta OTP göndərildi.
        '400':
          description: Validasiya xətası
        '409':
          description: E-poçt və ya telefon artıq qeydiyyatdan keçib

  /auth/register/provider:
    post:
      summary: Yeni xidmət təminatçısı (provider) qeydiyyatı
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, companyName, email, phone, categoryId, address, password, confirmPassword]
              properties:
                firstName:
                  type: string
                  example: "Cəmilə"
                lastName:
                  type: string
                  example: "Məmmədova"
                companyName:
                  type: string
                  example: "Cəmilə Təmizlik"
                email:
                  type: string
                  format: email
                  example: "cemile@example.com"
                phone:
                  type: string
                  example: "+994501234567"
                categoryId:
                  type: string
                  example: "64efc9abc1234567890abc01"
                  description: "Seçilmiş xidmət kateqoriyasının ObjectId-si"
                address:
                  type: string
                  example: "Neftçilər pr, 12, Bakı"
                password:
                  type: string
                  format: password
                  example: "sirr123"
                confirmPassword:
                  type: string
                  format: password
                  example: "sirr123"
      responses:
        '201':
          description: Qeydiyyat tamamlandı, e-poçta OTP göndərildi.
        '400':
          description: Validasiya xətası (məs. şifrələr uyğun gəlmir)
        '409':
          description: E-poçt və ya telefon artıq qeydiyyatdan keçib


  /auth/register/verify-otp:
    post:
      summary: Qeydiyyat üçün göndərilmiş OTP-ni təsdiqlə
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                  example: "ali@example.com"
                code:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: E-poçt uğurla təsdiqləndi və İstifadəçi məlumatları & JWT token qaytarılır.
        '400':
          description: Yanlış OTP və ya vaxtı keçib
        '429':
          description: Çox sayda uyğun olmayan cəhd

  /auth/register/resend-otp:
    post:
      summary: Müddəti bitmiş və ya təsdiqlənməmiş hesablar üçün yeni OTP tələb et
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: "ali@example.com"
      responses:
        '200':
          description: Yeni OTP göndərildi.
        '400':
          description: Validasiya xətası və ya hesab artıq təsdiqlənib
        '404':
          description: İstifadəçi tapılmadı
        '429':
          description: Lütfən 1 dəqiqə gözləyin (Çox tez-tez cəhd)
        '500':
          description: Server xətası

  /auth/login:
    post:
      summary: İstifadəçi və ya providerin E-poçt & Şifrə ilə daxil olması
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "ali@example.com"
                password:
                  type: string
                  format: password
                  example: "sirr123"
      responses:
        '200':
          description: Uğurlu giriş, JWT token və İstifadəçi məlumatlarını qaytarır.
        '401':
          description: Yanlış məlumatlar (şifrə və ya e-poçt səhvdir)

  /auth/forgot-password:
    post:
      summary: Şifrənin sıfırlanması üçün OTP tələb et
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
               type: object
               required: [email]
               properties:
                 email:
                   type: string
                   format: email
                   example: "ali@example.com"
      responses:
        '200':
          description: OTP göndərildi (Təhlükəsizlik məqsədilə, format düzgündürsə həmişə uğur qaytarır).

  /auth/forgot-password/verify-otp:
    post:
      summary: Şifrə sıfırlamaq üçün göndərilən OTP-ni təsdiqlə
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                  example: "ali@example.com"
                code:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Kod uğurla təsdiqləndi, müvəqqəti sıfırlama tokeni (reset token) qaytarır.
        '400':
          description: Yanlış OTP və ya vaxtı keçib

  /auth/forgot-password/reset-password:
    post:
      summary: Müvəqqəti token vasitəsilə şifrəni yenilə
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resetToken, newPassword]
              properties:
                resetToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                newPassword:
                  type: string
                  format: password
                  example: "yeniSirr123"
      responses:
        '200':
          description: Şifrə uğurla dəyişdirildi.
        '400':
          description: Yanlış və ya vaxtı keçmiş sıfırlama tokeni.

  # ==============================
  #          USER ROUTES (İSTİFADƏÇİ VƏ PROVAYDER)
  # ==============================
  /users/change-password:
    put:
      summary: İstifadəçinin (User və Provider) şifrəsini yenilə
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, confirmPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                  example: "kohneSirr123"
                newPassword:
                  type: string
                  format: password
                  example: "yeniSirr123"
                confirmPassword:
                  type: string
                  format: password
                  example: "yeniSirr123"
      responses:
        '200':
          description: Şifrə uğurla yeniləndi.
        '400':
          description: Şifrələr uyğun gəlmir və ya cari şifrə səhvdir.
        '401':
          description: İcazəsiz (Token əskik və ya keçərsizdir)
        '404':
          description: İstifadəçi tapılmadı.

  /users/user:
    get:
      summary: Adi istifadəçi profilini gətir
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: İstifadəçi profili uğurla gətirildi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: "64efc9abc1234567890def12"
                      role:
                        type: string
                        example: "user"
                      fullName:
                        type: string
                        example: "Əli Əliyev"
                      email:
                        type: string
                        example: "ali@example.com"
                      phone:
                        type: string
                        example: "+994551234567"
                      emailVerified:
                        type: boolean
                        example: true
                      profileImage:
                        type: string
                        example: "https://res.cloudinary.com/.../profile.jpg"
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '401':
          description: İcazəsiz (Token əskik və ya keçərsizdir)
        '403':
          description: Bu API yalnız adi istifadəçilər üçündür.
        '404':
          description: İstifadəçi tapılmadı
    put:
      summary: Yalnız adi istifadəçi (User) məlumatlarını yenilə
      description: |
        Profil məlumatlarını yeniləyir.
        **Email dəyişdirildikdə** köhnə emailə OTP göndərilir. Email dəyişikliyi `POST /users/verify-email-change` ilə təsdiqlənməlidir.
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  example: "Yeni Ad Soyad"
                email:
                  type: string
                  format: email
                  example: "yeniemail@example.com"
                  description: "Dəyişdirildikdə köhnə emailə OTP göndərilir"
                phone:
                  type: string
                  example: "+994551112233"
                  description: "Başqa hesabda olmayan nömrə"
                bio:
                  type: string
                  example: "Salam, mən Əliyəm!"
                profileImage:
                  type: string
                  format: binary
                  description: "Profil şəkli faylı (multipart)"
      responses:
        '200':
          description: Profil yeniləndi (email dəyişibsə OTP göndərildi).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Profiliniz yeniləndi. Email dəyişikliyi üçün köhnə emailinizə təsdiq kodu göndərildi."
                  requiresEmailVerification:
                    type: boolean
                    example: true
                    description: "true olduqda /users/verify-email-change çağırılmalıdır"
                  user:
                    type: object
        '401':
          description: İcazəsiz (Token əskik və ya keçərsizdir)
        '403':
          description: Provider və ya Admin bu api-dən istifadə edə bilməz
        '404':
          description: İstifadəçi tapılmadı
        '409':
          description: E-poçt və ya telefon nömrəsi artıq istifadədədir

  /users/provider:
    get:
      summary: Provider profilini gətir
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Provider profili uğurla gətirildi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  provider:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: "64efc9abc1234567890def12"
                      role:
                        type: string
                        example: "provider"
                      fullName:
                        type: string
                        example: "Cəmilə Məmmədova"
                      email:
                        type: string
                        example: "cemile@example.com"
                      phone:
                        type: string
                        example: "+994501234567"
                      emailVerified:
                        type: boolean
                        example: true
                      profileImage:
                        type: string
                        example: "https://res.cloudinary.com/.../profile.jpg"
                        nullable: true
                      providerProfile:
                        type: object
                        properties:
                          companyName:
                            type: string
                            example: "Cəmilə Təmizlik"
                          categoryId:
                            type: string
                            example: "64efc9abc1234567890abc01"
                          address:
                            type: string
                            example: "Neftçilər pr, 12, Bakı"
                          verified:
                            type: boolean
                            example: true
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '401':
          description: İcazəsiz (Token əskik və ya keçərsizdir)
        '403':
          description: Bu API yalnız providerlər üçündür.
        '404':
          description: Provider tapılmadı
    put:
      summary: Yalnız xidmət təminatçısı (Provider) məlumatlarını yenilə
      description: |
        Provider profil məlumatlarını yeniləyir.
        **Email dəyişdirildikdə** köhnə emailə OTP göndərilir. Email dəyişikliyi `POST /users/verify-email-change` ilə təsdiqlənməlidir.
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  example: "Yeni Şirkət Sahibi"
                email:
                  type: string
                  format: email
                  example: "sirket@example.com"
                  description: "Dəyişdirildikdə köhnə emailə OTP göndərilir"
                phone:
                  type: string
                  example: "+994501112233"
                  description: "Başqa hesabda olmayan nömrə"
                bio:
                  type: string
                  example: "Xidmətlərimizi daha sərfəli və keyfiyyətli etdik."
                location:
                  type: string
                  example: "Gəncə, Azərbaycan"
                profileImage:
                  type: string
                  format: binary
                  description: "Profil şəkli faylı (multipart)"
                companyName:
                  type: string
                  example: "Cəmilə Təmizlik"
                  description: "Şirkət adı (providerProfile.companyName)"
      responses:
        '200':
          description: Provider profili yeniləndi (email dəyişibsə OTP göndərildi).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Profiliniz yeniləndi. Email dəyişikliyi üçün köhnə emailinizə təsdiq kodu göndərildi."
                  requiresEmailVerification:
                    type: boolean
                    example: true
                    description: "true olduqda /users/verify-email-change çağırılmalıdır"
                  user:
                    type: object
        '401':
          description: İcazəsiz (Token əskik və ya keçərsizdir)
        '403':
          description: İstifadəçi provider deyil (icazə yoxdur)
        '404':
          description: İstifadəçi tapılmadı
        '409':
          description: E-poçt və ya telefon nömrəsi artıq istifadədədir

  /users/profile-image:
    delete:
      summary: "Profil şəklini sil"
      description: "🔐 **LOGIN TƏLƏB OLUNUR** — Həm User, həm Provider istifadə edə bilər. Cloudinary-dən silinir və DB-dən təmizlənir."
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil şəkli silindi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Profil şəkli silindi."
        '400':
          description: Profil şəkli mövcud deyil
        '401':
          description: Login tələb olunur

  /users/verify-email-change:
    post:
      summary: Email dəyişmə OTP-ni təsdiqlə
      description: |
        **Email dəyişmə prosesinin 2-ci addımı.**
        
        `PUT /users/user` və ya `PUT /users/provider` vasitəsilə yeni email göndərildikdə **köhnə emailə** 6 rəqəmli OTP kodu göndərilir.
        Bu endpoint həmin OTP-ni qəbul edib doğru olduğunu yoxlayır və istifadəçinin emailini yeni email ünvanına keçirir.
        
        **Axın:**
        1. `PUT /users/user` → `{ email: "yeni@email.com" }` → Server köhnə emailə OTP göndərir
        2. İstifadəçi köhnə emaildən kodu alır
        3. `POST /users/verify-email-change` → `{ code: "123456" }` → Email dəyişir
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  example: "847291"
                  description: "Köhnə emailə göndərilən 6 rəqəmli OTP"
      responses:
        '200':
          description: Email uğurla dəyişdirildi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Email ünvanınız uğurla yeniləndi."
                  user:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: "64efc9abc1234567890def12"
                      email:
                        type: string
                        example: "yeni@example.com"
                      fullName:
                        type: string
                        example: "Əli Əliyev"
                      role:
                        type: string
                        example: "user"
        '400':
          description: OTP yanlışdır, vaxtı bitib və ya tələb tapılmadı.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "OTP yanlışdır."
                  attemptsLeft:
                    type: integer
                    example: 3
                    description: "Qalan cəhd sayı (yalnız yanlış kod halında)"
        '401':
          description: İcazəsiz (Token əskik və ya keçərsizdir)
        '404':
          description: İstifadəçi tapılmadı
        '409':
          description: Yeni email artıq başqa bir istifadəçiyə məxsusdur
        '429':
          description: Çox cəhd edildi. Yenidən email dəyişmə tələbi göndərin.

  /users/account:
    delete:
      summary: Hesabı sil (User və ya Provider)
      description: |
        İstifadəçinin (və ya xidmət təminatçısının) öz hesabını silməsi.
        Bu əməliyyat hesabı, profil şəklini və OTP-ləri silir.
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Hesab uğurla silindi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Hesabınız uğurla silindi."
        '401':
          description: İcazəsiz (Token əskik və ya keçərsizdir)
        '404':
          description: İstifadəçi tapılmadı
        '500':
          description: Server xətası

  /users/block/{id}:
    post:
      summary: İstifadeçini blokla
      description: |
        Digər istifadəçini (və ya provider-i) bloklamaq.
        Bloklayan tərəf, bloklanan tərəfin videolarını feed və explore-da görməyəcək.
        Adminə email bildirişi gedir.
      tags: [User]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Bloklanacaq istifadəçinin ID-si
      responses:
        '200':
          description: Uğurlu əməliyyat
        '400':
          description: Özünüzü bloklaya bilməzsiniz
        '401':
          description: Login tələb olunur
        '404':
          description: İstifadəçi tapılmadı

  /users/unblock/{id}:
    post:
      summary: İstifadeçini blokdan çıxart
      tags: [User]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Blokdan çıxarılacaq istifadəçinin ID-si
      responses:
        '200':
          description: Uğurlu əməliyyat
        '401':
          description: Login tələb olunur

  /users/report:
    post:
      summary: Şikayət etmək (Report)
      description: |
        İstifadəçi və ya videonu şikayət etmək üçün.
        Adminə dərhal email vasitəsilə bildiriş göndərilir.
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reportedUserId:
                  type: string
                  description: Şikayət edilən istifadəçinin ID-si (isteğe bağlı)
                videoId:
                  type: string
                  description: Şikayət edilən videonun ID-si (isteğe bağlı)
                reason:
                  type: string
                  description: Şikayət səbəbi (məs: "18+ məzmun", "Təhqir")
                details:
                  type: string
                  description: Əlavə məlumat
      responses:
        '200':
          description: Şikayət qəbul edildi
        '400':
          description: Şikayət səbəbi mütləqdir
        '401':
          description: Login tələb olunur

  # ==============================
  #    VIDEO FEED / EXPLORE (BİRLƏŞDİRİLMİŞ API)
  # ==============================
  /videos/feed:
    get:
      summary: "Ana Səhifə (Reels) üçün təsadüfi videolar"
      description: >
        GUEST DOSTu — Token olmadan da işləyir.
        BİRLƏŞDİRİLMİŞ API — provider phone, likeCount, saveCount, isLiked, isSaved hamısı bir response-da.
      tags: [Video]
      security: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Qaytarılacaq video sayı
      responses:
        '200':
          description: Videolar + provider + engagement bir response-da
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
